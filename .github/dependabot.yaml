# .github/dependabot.yml
version: 2
updates:
  # Keep Go modules up to date
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "davidcollom"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "davidcollom"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Keep Docker base images fresh
  # Dependabot scans every file in the directory whose name contains
  # "Dockerfile", so this entry covers both Dockerfile and
  # Dockerfile.goreleaser (see #139, which bumped the pin in both).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "davidcollom"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"
